name: PR Validation

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peon_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Setup test database
        run: |
          npx prisma migrate reset --force --skip-seed
          npx prisma migrate deploy
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5433/peon_test?schema=public

      - name: Run linting (Required for merge)
        run: npm run lint

      - name: Run tests (Required for merge)
        run: npm run test
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5433/peon_test?schema=public
          TEST_APP_URL: http://localhost:3001
          NODE_ENV: test

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
