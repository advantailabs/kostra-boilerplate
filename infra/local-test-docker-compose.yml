services:
  postgres-test:
    image: postgres:16-alpine
    container_name: peon-postgres-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=peon_test
    ports:
      - "5433:5432"
    volumes:
      - ./data/pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peon_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-test:
    build:
      context: ..
      dockerfile: infra/Dockerfile-local.dockerfile
    container_name: peon-app-test
    environment:
      - NODE_ENV=test
      - HOST=0.0.0.0
      - POSTGRES_URL=postgresql://postgres:postgres@postgres-test:5432/peon_test?schema=public
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3001:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      postgres-test:
        condition: service_healthy
    command: sh -lc "npx prisma migrate reset --force --skip-seed && npm run migrate:prod && npm run dev"

volumes:
  pgdata_test:
