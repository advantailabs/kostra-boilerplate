services:
  postgres:
    image: postgres:16-alpine
    container_name: kostra-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kostra
    ports:
      - "5434:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kostra"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile-local.dockerfile
    container_name: kostra-app
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/kostra?schema=public
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "npm run generate && npm run migrate:prod && npm run dev"

volumes:
  pgdata:
